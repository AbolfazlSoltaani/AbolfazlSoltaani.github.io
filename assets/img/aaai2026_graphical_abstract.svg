<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <style>
      .title-text { font-family: Arial, sans-serif; font-size: 18px; font-weight: bold; fill: #2c3e50; }
      .label-text { font-family: Arial, sans-serif; font-size: 14px; fill: #34495e; }
      .small-text { font-family: Arial, sans-serif; font-size: 12px; fill: #7f8c8d; }
      .interval { fill: #3498db; opacity: 0.8; stroke: #2980b9; stroke-width: 2; }
      .interval-pred { fill: #e74c3c; opacity: 0.8; stroke: #c0392b; stroke-width: 2; }
      .interval-robust { fill: #2ecc71; opacity: 0.8; stroke: #27ae60; stroke-width: 2; }
      .arrow { fill: none; stroke: #34495e; stroke-width: 2; marker-end: url(#arrowhead); }
      .dashed { stroke-dasharray: 5,5; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#34495e" />
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" class="title-text">Online Interval Scheduling with Predictions</text>
  
  <!-- Left side: Incoming intervals with predictions -->
  <g id="incoming-intervals">
    <text x="120" y="70" text-anchor="middle" class="label-text">Incoming Intervals</text>
    <text x="120" y="88" text-anchor="middle" class="small-text">(with predictions)</text>
    
    <!-- Timeline -->
    <line x1="30" y1="120" x2="210" y2="120" stroke="#bdc3c7" stroke-width="2"/>
    
    <!-- Intervals arriving -->
    <rect x="40" y="105" width="60" height="20" class="interval-pred" rx="3"/>
    <text x="70" y="100" text-anchor="middle" class="small-text">I₁</text>
    
    <rect x="60" y="135" width="80" height="20" class="interval" rx="3"/>
    <text x="100" y="130" text-anchor="middle" class="small-text">I₂</text>
    
    <rect x="110" y="165" width="50" height="20" class="interval" rx="3"/>
    <text x="135" y="160" text-anchor="middle" class="small-text">I₃</text>
    
    <!-- Prediction annotation -->
    <circle cx="70" cy="95" r="3" fill="#e74c3c"/>
    <text x="85" y="98" class="small-text" fill="#e74c3c">prediction</text>
  </g>
  
  <!-- Middle: Framework -->
  <g id="framework">
    <!-- Arrow from input -->
    <path d="M 210 140 L 260 140" class="arrow"/>
    
    <!-- Framework box -->
    <rect x="260" y="100" width="280" height="140" fill="#ecf0f1" stroke="#95a5a6" stroke-width="2" rx="5"/>
    <text x="400" y="125" text-anchor="middle" class="label-text" font-weight="bold">SemiTrust-and-Switch Framework</text>
    
    <!-- Two algorithms inside -->
    <g id="prediction-alg">
      <rect x="280" y="140" width="110" height="40" fill="#ffe6e6" stroke="#e74c3c" stroke-width="2" rx="3"/>
      <text x="335" y="158" text-anchor="middle" class="small-text" font-weight="bold">Prediction-Based</text>
      <text x="335" y="173" text-anchor="middle" class="small-text">Algorithm</text>
    </g>
    
    <g id="robust-alg">
      <rect x="410" y="140" width="110" height="40" fill="#e6f7ed" stroke="#2ecc71" stroke-width="2" rx="3"/>
      <text x="465" y="158" text-anchor="middle" class="small-text" font-weight="bold">Robust</text>
      <text x="465" y="173" text-anchor="middle" class="small-text">Algorithm</text>
    </g>
    
    <!-- Switching logic -->
    <path d="M 335 185 L 335 200 L 400 200 L 465 200 L 465 185" fill="none" stroke="#7f8c8d" stroke-width="2"/>
    <circle cx="400" cy="200" r="4" fill="#7f8c8d"/>
    <text x="400" y="220" text-anchor="middle" class="small-text" fill="#7f8c8d">Switch/Combine</text>
  </g>
  
  <!-- Right side: Output guarantees -->
  <g id="output">
    <!-- Arrow to output -->
    <path d="M 540 170 L 590 170" class="arrow"/>
    
    <rect x="590" y="100" width="180" height="140" fill="#fff" stroke="#95a5a6" stroke-width="2" rx="5"/>
    <text x="680" y="125" text-anchor="middle" class="label-text" font-weight="bold">Guarantees</text>
    
    <!-- Performance graph -->
    <g transform="translate(610, 140)">
      <!-- Axes -->
      <line x1="10" y1="80" x2="150" y2="80" stroke="#34495e" stroke-width="1.5"/>
      <line x1="10" y1="10" x2="10" y2="80" stroke="#34495e" stroke-width="1.5"/>
      
      <!-- Labels -->
      <text x="80" y="98" text-anchor="middle" class="small-text">Prediction Error</text>
      <text x="-5" y="45" text-anchor="end" class="small-text" transform="rotate(-90, -5, 45)">Performance</text>
      
      <!-- Curve showing smooth degradation -->
      <path d="M 10 15 Q 80 15 150 70" fill="none" stroke="#9b59b6" stroke-width="3"/>
      
      <!-- Key points -->
      <circle cx="10" cy="15" r="3" fill="#e74c3c"/>
      <text x="25" y="18" class="small-text" fill="#e74c3c">Consistent</text>
      
      <circle cx="150" cy="70" r="3" fill="#2ecc71"/>
      <text x="120" y="73" text-anchor="end" class="small-text" fill="#2ecc71">Robust</text>
      
      <text x="80" y="40" text-anchor="middle" class="small-text" fill="#9b59b6" font-style="italic">Smooth</text>
    </g>
  </g>
  
  <!-- Bottom: Key properties -->
  <g id="properties">
    <rect x="50" y="280" width="700" height="100" fill="#f8f9fa" stroke="#dee2e6" stroke-width="2" rx="5"/>
    
    <text x="400" y="305" text-anchor="middle" class="label-text" font-weight="bold">Key Properties</text>
    
    <g transform="translate(80, 320)">
      <circle cx="0" cy="0" r="5" fill="#e74c3c"/>
      <text x="15" y="5" class="small-text"><tspan font-weight="bold">Consistency:</tspan> Excellent performance with accurate predictions</text>
    </g>
    
    <g transform="translate(80, 345)">
      <circle cx="0" cy="0" r="5" fill="#2ecc71"/>
      <text x="15" y="5" class="small-text"><tspan font-weight="bold">Robustness:</tspan> Guaranteed performance even with poor predictions</text>
    </g>
    
    <g transform="translate(80, 370)">
      <circle cx="0" cy="0" r="5" fill="#9b59b6"/>
      <text x="15" y="5" class="small-text"><tspan font-weight="bold">Smoothness:</tspan> Graceful degradation as prediction quality decreases</text>
    </g>
  </g>
</svg>