main:

  - title: "A Switching Framework for Online Interval Scheduling with Predictions"
    authors: "A Antoniadis, A Shahheidar, G Shahkarami, <strong>A Soltani</strong>"
    venue: "AAAI Conference on Artificial Intelligence, 2026"
    year: 2026
    badge: "AAAI 2026"
    image: assets/img/aaai2026_graphical_abstract.svg
    pdf: https://arxiv.org/pdf/2511.16194
    abstract: "We study online interval scheduling in the irrevocable setting, where each interval must be immediately accepted or rejected upon arrival. The objective is to maximize the total length of accepted intervals while ensuring that no two accepted intervals overlap. We consider this problem in a learning-augmented setting, where the algorithm has access to (machine-learned) predictions. The goal is to design algorithms that leverage these predictions to improve performance while maintaining robust guarantees in the presence of prediction errors. Our main contribution is the SemiTrust-and-Switch framework, which provides a unified approach for combining prediction-based and classical interval scheduling algorithms."
